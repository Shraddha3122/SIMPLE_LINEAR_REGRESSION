<!DOCTYPE html>
<html>
<head>
    <title>Salary Prediction</title>
</head>
<body>
    <h1>Predict Employee Salary</h1>
    <form id="salary-form" method="post">
        <label for="experience">Years of Experience:</label>
        <input type="number" id="experience" name="experience" step="0.1" required>
        <button type="button" onclick="getPrediction()">Predict</button>
    </form>
    <h2 id="result"></h2>

    <script>
        async function getPrediction() {
            const experience = document.getElementById('experience').value;
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ experience })
            });

            const data = await response.json();
            const resultElement = document.getElementById('result');

            if (data.predicted_salary) {
                resultElement.textContent = `Predicted Salary: ₹${data.predicted_salary.toFixed(2)}`;
            } else {
                resultElement.textContent = `Error: ${data.error}`;
            }
        }
    </script>
</body>
</html>
